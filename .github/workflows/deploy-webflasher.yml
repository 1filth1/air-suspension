name: Deploy web flasher

on:
  push:
    branches:
      - codex/pre-release-central-settings
    paths:
      - "webflasher/**"
      - ".github/workflows/deploy-webflasher.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webflasher
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
