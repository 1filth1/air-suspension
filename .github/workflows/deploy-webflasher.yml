name: Deploy web flasher

on:
  workflow_run:
    workflows:
      - "pages build and deployment"
    types:
      - completed
    branches:
      - codex/pre-release-central-settings
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Download release firmware for same-origin hosting
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p webflasher/firmware
          while IFS=$'\t' read -r tag key asset; do
            [ -n "$asset" ] || continue
            filename="${asset##*/}"
            mkdir -p "webflasher/firmware/$tag"
            if [[ "$asset" == https://* ]]; then
              url="$asset"
            else
              url="https://github.com/${GITHUB_REPOSITORY}/releases/download/$tag/$filename"
            fi
            echo "Downloading $tag / $key"
            if ! curl --fail --location --retry 3 --retry-delay 2 "$url" -o "webflasher/firmware/$tag/$filename"; then
              echo "::warning::Skipping unavailable legacy asset: $tag / $key ($filename)"
              rm -f "webflasher/firmware/$tag/$filename"
              continue
            fi
            test -s "webflasher/firmware/$tag/$filename"
          done < <(jq -r '.releases[] as $r | $r.assets | to_entries[] | [$r.tag, .key, .value] | @tsv' webflasher/releases.json)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: webflasher
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
