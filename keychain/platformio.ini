; Keychain remote — TTGO T-Display (ESP32, ST7789 135x240, SPI).
;
; Build:  pio run -e keychain
; Flash:  pio run -e keychain -t upload
;
; The sketch carries its own ST7789 driver, so no TFT library is needed and no
; User_Setup.h has to be edited. Only Adafruit GFX supplies the drawing
; primitives and the built-in font.

[platformio]
src_dir = src
include_dir = .

[env:keychain]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_deps =
  adafruit/Adafruit GFX Library@1.11.11
